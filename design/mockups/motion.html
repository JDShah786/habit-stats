<title>Habit Stats Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-sized stage. Command menu home → diagonal wipe → four swipeable sections. Log sheet and rank-up overlay sit above. */
:root {
  color-scheme: dark;
  --bg: #050807; --depth: #0d1f12; --g: #39ff7a; --lime: #c6ff3d; --ink: #fff; --muted: #9bb8a2;
  --black: #000; --line: rgb(255 255 255 / 0.85); --warn: #ff8a7a; --frame: #020302;
  --f-display: 'Montserrat', 'Arial Black', system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { all: unset; box-sizing: border-box; cursor: pointer; }
input { all: unset; box-sizing: border-box; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
.d { font-family: var(--f-display); font-weight: 900; font-style: italic; }

.stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(110% 60% at 100% 0%, var(--depth), var(--bg) 70%); }
@media (min-width: 520px) {
  body { display: grid; place-items: center; background: var(--frame); }
  .stage { width: 390px; height: min(844px, 100% - 24px); border-radius: 44px; box-shadow: 0 0 0 10px #111, 0 30px 80px rgb(0 0 0 / 0.6); }
}

/* Ambient water: bubbles bob, a faint stripe */
.bub { position: absolute; border-radius: 50%; opacity: 0.5; pointer-events: none; animation: bob 7s ease-in-out infinite alternate;
  background: radial-gradient(circle at 30% 30%, rgb(255 255 255 / 0.6), color-mix(in srgb, var(--g) 45%, transparent) 40%, transparent 72%); }
.bub:nth-child(2n) { animation-duration: 9s; animation-delay: -3s; }
@keyframes bob { to { transform: translateY(-22px); } }
.stripe { position: absolute; left: -60px; right: -60px; height: 120px; background: linear-gradient(90deg, var(--g), var(--lime)); opacity: 0.1; transform: rotate(-14deg); pointer-events: none; }
.rm .bub, .rm .wave svg, .rm .ru-stripes, .rm .rise { animation: none !important; }

/* Date block */
.date { position: absolute; left: 18px; top: 18px; transform: rotate(-6deg); transform-origin: left top; z-index: 3; pointer-events: none; }
.date .num { font-size: 62px; line-height: 0.9; letter-spacing: -0.04em; text-shadow: 5px 5px 0 var(--black), 7px 7px 0 var(--g); }
.date .num small { font-size: 36px; }
.date .day { display: inline-block; margin-top: 8px; padding: 3px 13px; border-radius: 999px; background: var(--g); color: var(--black); font-size: 18px; box-shadow: 4px 4px 0 var(--black); }
.date .time { margin-left: 8px; font: 800 11px var(--f-display); letter-spacing: 0.2em; color: var(--lime); }

.view { position: absolute; inset: 0; }
.ghost { position: absolute; left: -14px; bottom: 30px; transform: rotate(-10deg); transform-origin: left bottom; pointer-events: none; }
.ghost-word { font-size: 104px; color: color-mix(in srgb, var(--g) 12%, transparent); white-space: nowrap; letter-spacing: -0.02em; }

/* Command menu */
.tagline { position: absolute; left: 20px; top: 150px; font: 800 12px var(--f-display); letter-spacing: 0.2em; color: var(--muted); transform: rotate(-6deg); }
.menu { position: absolute; right: -6px; top: 29%; transform: rotate(-10deg); transform-origin: right; display: grid; gap: 4px; justify-items: end; }
/* Sizes and the staircase step shrink on narrow phones so the longest word (MY HABITS, selected) stays on screen. */
.menu { --step: min(26px, 6vw); }
.menu button { font-size: min(42px, 11vw); letter-spacing: -0.03em; line-height: 1.08; color: var(--ink); text-shadow: 4px 4px 0 var(--black); padding: 0 22px; white-space: nowrap; border-radius: 999px; }
.menu button:nth-child(2) { margin-right: var(--step); } .menu button:nth-child(3) { margin-right: calc(var(--step) * 2); } .menu button:nth-child(4) { margin-right: calc(var(--step) * 3); }
.menu button.sel { background: linear-gradient(100deg, var(--g), var(--lime)); color: var(--black); text-shadow: none; box-shadow: 8px 8px 0 var(--black), 10px 10px 0 var(--ink); font-size: min(50px, 12.5vw); }
.menu .hint { font-size: 12px; font-style: normal; font-weight: 800; letter-spacing: 0.2em; color: var(--lime); margin-right: 30px; margin-top: 8px; font-family: var(--f-display); }
.card { position: absolute; left: 16px; bottom: 24px; width: 236px; padding: 14px 16px; border-radius: 26px; background: var(--black); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--g); }
.card-tilt { position: absolute; left: 0; bottom: 0; transform: rotate(3deg); transform-origin: left bottom; }
.card h3 { font-size: 15px; color: var(--g); margin-bottom: 6px; letter-spacing: 0.06em; }
.card p { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-top: 6px; }
.card p i, .row-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 0.5); flex: none; }
.card p i.on { border: 0; background: radial-gradient(circle at 32% 30%, var(--ink) 0 14%, var(--lime) 24%, var(--g) 60%); box-shadow: 0 0 8px var(--g); }
.card p span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card p em { margin-left: auto; font: 900 italic 14px var(--f-display); font-variant-numeric: tabular-nums; }

/* Sections */
.menu-btn { position: absolute; top: 22px; right: 16px; z-index: 4; padding: 7px 14px; border-radius: 999px; border: 2px solid var(--g); color: var(--g); font-size: 13px; letter-spacing: 0.08em; background: var(--black); box-shadow: 3px 3px 0 var(--g); }
.tabs { position: absolute; left: -24px; right: -24px; top: 134px; height: 48px; background: var(--black); border-block: 3px solid var(--g); transform: rotate(-4deg); display: flex; align-items: center; justify-content: space-around; padding: 0 36px; z-index: 2; }
.tabs button { position: relative; z-index: 1; font-size: clamp(11px, 3.4vw, 13px); letter-spacing: 0.03em; color: var(--muted); padding: 6px 9px; white-space: nowrap; }
.tabs button.on { color: var(--black); }
.cursor { position: absolute; top: 6px; height: 30px; border-radius: 999px; background: linear-gradient(100deg, var(--g), var(--lime)); box-shadow: 3px 3px 0 var(--ink); }
.panes { position: absolute; left: 0; right: 0; top: 196px; bottom: 0; overflow: hidden; }
.track { display: flex; height: 100%; width: 400%; touch-action: pan-y; will-change: transform; }
.pane { flex: 0 0 25%; height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 18px 18px 110px; touch-action: pan-y; scrollbar-width: none; }
.pane::-webkit-scrollbar { display: none; }
/* Tilt each item on its own, never a whole list: a rotated tall list drifts sideways the further down it goes.
   CSS `rotate` composes with the `transform` Motion writes, so items can still animate. */
.tilt .label, .tilt .pill, .tilt .near, .tilt .row, .tilt .stat, .tilt .custom, .search, .chips, .mh-head { rotate: -4deg; }

.label { display: inline-block; padding: 3px 12px; border-radius: 999px; border: 2px solid var(--g); color: var(--g); font-size: 13px; letter-spacing: 0.12em; }
.group { margin-bottom: 26px; }
.pill { position: relative; display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 22px 0 16px; border-radius: 999px; margin-top: 22px; margin-left: var(--off, 0px); width: calc(100% - var(--off, 0px) - 24px);
  background: var(--black); border: 2px solid var(--line); box-shadow: 6px 6px 0 color-mix(in srgb, var(--g) 35%, transparent); }
.pill .fill { position: absolute; inset: -2px; border-radius: inherit; background: linear-gradient(100deg, var(--g), var(--lime)); transform-origin: left; opacity: 0; }
.pill > :not(.fill) { position: relative; }
.pill .chk { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 0.5); flex: none; }
.pill .nm { flex: 1; min-width: 0; font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill .mn { position: absolute; right: -6px; top: -18px; font-size: 38px; letter-spacing: -0.03em; text-shadow: 3px 3px 0 var(--black); font-variant-numeric: tabular-nums; }
.pill .mn small { font-size: 15px; }
.pill.on { color: var(--black); border-color: var(--ink); box-shadow: 7px 7px 0 var(--black), 9px 9px 0 var(--line); }
.pill.on .fill { opacity: 1; }
.pill.on .chk { border: 0; background: radial-gradient(circle at 32% 30%, var(--ink) 0 14%, var(--black) 22%); }
.pill.on .mn { color: var(--ink); }
.empty { margin-top: 12px; color: var(--muted); font-size: 14px; }
.near { margin-top: 10px; }
.near .top { display: flex; align-items: baseline; gap: 10px; }
.near b { font-size: 26px; }
.near .up { background: var(--lime); color: var(--black); padding: 2px 10px; border-radius: 999px; font-size: 12px; }
.bar { position: relative; margin-top: 8px; height: 16px; border-radius: 999px; background: var(--black); border: 2px solid var(--ink); overflow: hidden; }
.bar .fill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--g), var(--lime)); transform-origin: left; }

/* Library */
.search { display: flex; align-items: center; gap: 10px; height: 48px; border-radius: 999px; background: var(--black); border: 2px solid var(--line); padding: 0 18px; }
.search span { color: var(--g); font-size: 14px; letter-spacing: 0.1em; }
.search input { flex: 1; min-width: 0; font-size: 16px; color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { padding: 6px 12px; border-radius: 999px; border: 2px solid var(--g); color: var(--g); font-size: 13px; letter-spacing: 0.05em; }
.chip.on { background: var(--g); color: var(--black); box-shadow: 3px 3px 0 var(--ink); }
.lib { margin-top: 14px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 10px 8px 18px; border-radius: 999px; background: var(--black); border: 2px solid rgb(255 255 255 / 0.45); margin-top: 10px; }
.row .meta { flex: 1; min-width: 0; }
.row .meta b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta small { display: block; margin-top: 2px; font: 800 10px var(--f-display); letter-spacing: 0.1em; color: var(--muted); }
.row.added { border-color: var(--g); box-shadow: 4px 4px 0 color-mix(in srgb, var(--g) 40%, transparent); }
.add { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--black); font-size: 24px; font-style: normal;
  background: radial-gradient(circle at 32% 28%, var(--ink) 0 10%, var(--lime) 24%, var(--g) 75%); box-shadow: 3px 3px 0 var(--ink); }
.pick { display: flex; gap: 6px; }
.pick button { padding: 8px 11px; border-radius: 999px; background: var(--lime); color: var(--black); font-size: 12px; box-shadow: 3px 3px 0 var(--ink); }
.tag { color: var(--g); font-size: 11px; letter-spacing: 0.08em; padding-right: 8px; white-space: nowrap; }

/* Stats */
.stat { position: relative; margin-top: 16px; margin-left: var(--off, 0px); width: calc(100% - var(--off, 0px) - 10px); padding: 12px 16px 14px; border-radius: 28px; background: var(--black); border: 2px solid var(--line); box-shadow: 6px 6px 0 color-mix(in srgb, var(--g) 35%, transparent); }
.stat .top { display: flex; align-items: center; gap: 10px; }
.stat h3 { font-size: 22px; letter-spacing: -0.01em; }
.stat .rk { margin-left: auto; background: var(--lime); color: var(--black); padding: 3px 11px; border-radius: 999px; font-size: 13px; box-shadow: 3px 3px 0 var(--ink); }
.stat .rk.max { background: var(--ink); box-shadow: 3px 3px 0 var(--g); }
.stat .ttl { margin-top: 2px; color: var(--g); font-size: 14px; letter-spacing: 0.08em; }
.pips { position: absolute; right: 18px; top: 46px; display: flex; gap: 4px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 0.4); }
.pips i.on { border: 0; background: radial-gradient(circle at 32% 30%, var(--ink) 0 18%, var(--lime) 30%, var(--g) 70%); }
.pts { margin-top: 6px; font: 800 12px var(--f-display); color: var(--muted); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.pts b { color: var(--ink); font-size: 15px; }

/* My habits */
.mh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#mineList .row { margin-right: 6px; }
.mh-head h2 { font-size: 26px; }
.ghost-btn { padding: 7px 13px; border-radius: 999px; border: 2px solid var(--g); color: var(--g); font-size: 12px; letter-spacing: 0.08em; }
.kind { font-size: 11px; letter-spacing: 0.08em; padding: 3px 9px; border-radius: 999px; background: var(--g); color: var(--black); }
.kind.any { background: transparent; color: var(--g); border: 2px solid var(--g); }
.rm-btn { font: 700 13px var(--f-body); color: var(--muted); padding: 8px 10px; }
.custom { display: block; margin-top: 20px; padding: 16px; text-align: center; border-radius: 999px; border: 2px dashed var(--g); color: var(--g); font-size: 16px; letter-spacing: 0.04em; }

/* Log sheet */
.backdrop { position: absolute; inset: 0; z-index: 20; background: rgb(0 0 0 / 0.62); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; padding: 4px 20px 26px; background: linear-gradient(180deg, var(--depth), var(--black) 70%); touch-action: none; }
.wave { position: absolute; left: 0; right: 0; top: -21px; height: 22px; overflow: hidden; pointer-events: none; }
.wave svg { width: 200%; height: 100%; display: block; animation: wave 5s linear infinite; }
@keyframes wave { to { transform: translateX(-50%); } }
.handle { width: 44px; height: 5px; border-radius: 9px; background: rgb(255 255 255 / 0.3); margin: 2px auto 12px; }
.sh-head { transform: rotate(-3deg); transform-origin: left; }
.sh-head h2 { font-size: 32px; line-height: 1; letter-spacing: -0.02em; text-shadow: 3px 3px 0 var(--black); }
.weights { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.weights span { font: 900 italic 11px var(--f-display); letter-spacing: 0.08em; padding: 3px 9px; border-radius: 999px; border: 2px solid var(--g); color: var(--g); }
.minutes { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
.mins { width: 3.4ch; font: 900 italic 80px var(--f-display); letter-spacing: -0.04em; color: var(--ink); text-shadow: 5px 5px 0 var(--black), 7px 7px 0 var(--g); caret-color: var(--lime); font-variant-numeric: tabular-nums; }
.mins::placeholder { color: rgb(255 255 255 / 0.25); text-shadow: none; }
.minutes .unit { font-size: 20px; color: var(--lime); }
.quick { display: flex; gap: 10px; margin-top: 6px; }
.q { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; color: var(--black); box-shadow: 3px 3px 0 var(--black);
  background: radial-gradient(circle at 32% 28%, var(--ink) 0 10%, var(--lime) 24%, var(--g) 75%); }
.q.on { box-shadow: 0 0 0 3px var(--ink), 4px 4px 0 3px var(--black); }
.err { margin-top: 10px; color: var(--warn); font-weight: 700; font-size: 14px; }
.sess { margin-top: 16px; }
#sessList { max-height: 128px; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; padding-right: 4px; }
.sess h4 { font: 800 11px var(--f-display); letter-spacing: 0.2em; color: var(--muted); }
.sess .none { margin-top: 6px; color: var(--muted); font-size: 14px; }
.srow { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 6px 6px 14px; border-radius: 999px; border: 2px solid rgb(255 255 255 / 0.3); }
.srow b { flex: 1; font: 900 italic 18px var(--f-display); }
.srow button { padding: 6px 12px; border-radius: 999px; border: 2px solid rgb(255 255 255 / 0.5); font: 700 13px var(--f-body); }
.log { display: block; width: calc(100% - 8px); text-align: center; margin-top: 18px; height: 58px; line-height: 58px; border-radius: 999px; background: linear-gradient(100deg, var(--g), var(--lime)); color: var(--black); font-size: 24px; letter-spacing: 0.02em; box-shadow: 6px 6px 0 var(--black), 8px 8px 0 var(--ink); }
.log[aria-disabled="true"] { opacity: 0.35; }

/* Effects */
.pop { position: absolute; z-index: 45; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 30% 30%, var(--ink) 0 12%, color-mix(in srgb, var(--lime) 85%, transparent) 30%, color-mix(in srgb, var(--g) 55%, transparent) 62%, transparent 72%); }
.float { position: absolute; z-index: 15; font-size: 18px; color: var(--lime); text-shadow: 3px 3px 0 var(--black); pointer-events: none; white-space: nowrap; }
.wipe { position: absolute; inset: -40% -70%; z-index: 40; pointer-events: none; transform: rotate(-14deg); display: flex; flex-direction: column; }
.wipe i { flex: 1; display: block; }
.wipe i:nth-child(1) { background: var(--g); }
.wipe i:nth-child(2) { background: var(--black); border-block: 5px solid var(--ink); }
.wipe i:nth-child(3) { background: var(--lime); }
.toast { position: absolute; left: 50%; top: 92px; z-index: 55; width: max-content; max-width: calc(100% - 40px); margin-left: auto; translate: -50% 0; padding: 9px 16px; border-radius: 999px; background: var(--ink); color: var(--black); font-weight: 700; font-size: 14px; box-shadow: 4px 4px 0 var(--g); pointer-events: none; }

/* Rank-up */
.ru { position: absolute; inset: 0; z-index: 50; overflow: hidden; display: grid; place-items: center; cursor: pointer; }
.ru-bg { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 42%, var(--depth), var(--black) 72%); }
.ru-stripes { position: absolute; inset: -30% -40%; display: flex; flex-direction: column; justify-content: center; gap: 110px; transform: rotate(-14deg); animation: drift 6s ease-in-out infinite alternate; }
@keyframes drift { from { transform: rotate(-14deg) translateX(-24px); } to { transform: rotate(-14deg) translateX(24px); } }
.ru-stripes i { display: block; height: 76px; background: linear-gradient(90deg, var(--g), var(--lime)); opacity: 0.85; }
.ru-stripes i:nth-child(2) { height: 30px; background: var(--ink); opacity: 0.9; }
.ru-flash { position: absolute; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; }
.rise { position: absolute; bottom: -50px; left: var(--l); width: var(--s); height: var(--s); border-radius: 50%; animation: rise var(--d) linear var(--dl) infinite; opacity: 0.7;
  background: radial-gradient(circle at 30% 30%, rgb(255 255 255 / 0.8), color-mix(in srgb, var(--g) 50%, transparent) 40%, transparent 72%); }
@keyframes rise { to { transform: translateY(-120vh); } }
.ru-rise { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.ru-shake { position: relative; width: 100%; }
.ru-content { text-align: center; transform: rotate(-6deg); padding-inline: 16px; }
.ru .seq { opacity: 0; }
.ru-label { display: inline-block; padding: 5px 18px; border-radius: 999px; background: var(--lime); color: var(--black); font-size: 22px; letter-spacing: 0.06em; box-shadow: 5px 5px 0 var(--black), 7px 7px 0 var(--ink); }
.ru-stat { display: block; margin-top: 14px; font-size: 72px; line-height: 0.95; letter-spacing: -0.03em; text-shadow: 5px 5px 0 var(--black), 8px 8px 0 var(--g); white-space: nowrap; }
.ru-rank { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 6px; }
.ru-rank small { display: block; font-size: 14px; letter-spacing: 0.2em; color: var(--lime); }
.ru-old { display: inline-block; font-size: 64px; color: var(--muted); text-shadow: 4px 4px 0 var(--black); }
.ru-arrow { display: inline-block; width: 0; height: 0; border-block: 16px solid transparent; border-left: 26px solid var(--ink); filter: drop-shadow(3px 3px 0 var(--black)); }
.ru-new { display: inline-block; font-size: 150px; line-height: 0.85; color: var(--lime); text-shadow: 6px 6px 0 var(--black), 9px 9px 0 var(--ink); }
.ru-title { display: flex; flex-wrap: wrap; row-gap: 8px; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
.ru-told { position: relative; display: inline-block; font-size: 18px; color: var(--muted); }
.ru-told i { position: absolute; left: -4px; right: -4px; top: 50%; height: 3px; background: var(--warn); transform-origin: left; }
.ru-tnew { display: inline-block; padding: 4px 16px; border-radius: 999px; background: linear-gradient(100deg, var(--g), var(--lime)); color: var(--black); font-size: 28px; box-shadow: 5px 5px 0 var(--black), 7px 7px 0 var(--ink); }
.ru-next { display: inline-block; margin-top: 16px; padding: 5px 12px; border-radius: 999px; background: var(--black); font: 800 12px var(--f-display); letter-spacing: 0.2em; color: var(--ink); }
.ru-tap { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; font: 800 12px var(--f-display); letter-spacing: 0.3em; color: var(--lime); }
.ru-tap span { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

/* Mockup-only controls */
.mock { position: absolute; right: 12px; bottom: 12px; z-index: 60; display: grid; justify-items: end; gap: 8px; }
.mock > button { padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--black); font: 800 11px var(--f-display); letter-spacing: 0.12em; box-shadow: 3px 3px 0 var(--g); }
.mock-panel { display: grid; gap: 6px; padding: 10px; border-radius: 20px; background: var(--black); border: 2px solid var(--ink); }
.mock-panel button { padding: 8px 12px; border-radius: 999px; border: 2px solid var(--g); color: var(--ink); font: 700 13px var(--f-body); text-align: left; }
.mock-panel button[aria-pressed="true"] { background: var(--g); color: var(--black); }

// ---------- Swipe between sections ----------
const track = $('track'), panes = [...track.children], tabs = [...$('tabs').querySelectorAll('button')]
let idx = 0, tx = 0, trackAnim = null, drag = null, suppressClick = false
const W = () => $('panes').clientWidth
function setTrack(v) {
  tx = v; track.style.transform = `translate3d(${v}px,0,0)`
  const p = Math.max(0, Math.min(3, -v / W())), i0 = Math.floor(p), f = p - i0, i1 = Math.min(i0 + 1, 3)
  const L = tabs[i0].offsetLeft + (tabs[i1].offsetLeft - tabs[i0].offsetLeft) * f
  const Wd = tabs[i0].offsetWidth + (tabs[i1].offsetWidth - tabs[i0].offsetWidth) * f
  const c = $('cursor'); c.style.left = L + 'px'; c.style.width = Wd + 'px'
  tabs.forEach((t, j) => t.classList.toggle('on', j === Math.round(p)))
  document.querySelector('.ghost-par').style.transform = `translate3d(${(-v / W() - idx) * -80}px,0,0)`
}
function goTo(i, velocity = 0) {
  const changed = i !== idx; idx = i
  trackAnim?.stop()
  const target = -i * W()
  if (RM) setTrack(target)
  else trackAnim = animate(tx, target, { type: 'spring', stiffness: 380, damping: 38, velocity, onUpdate: setTrack })
  if (changed) {
    enterPane(i)
    $('ghostWord').textContent = SECTIONS[i]
    fx($('ghostWord'), { y: [50, 0], opacity: [0, 1] }, SOFT)
  }
}
function enterPane(i) {
  if (RM) { animate(panes[i], { opacity: [0, 1] }, { duration: 0.18 }); return }
  animate(panes[i].querySelectorAll('.in'), { x: [70, 0], opacity: [0, 1] }, { ...SNAP, delay: stagger(0.045) })
  if (i === 2) fillStats()
}
tabs.forEach((t, i) => t.addEventListener('click', () => goTo(i)))
track.addEventListener('pointerdown', (e) => {
  if (e.button > 0) return
  trackAnim?.stop()
  drag = { x0: e.clientX, y0: e.clientY, t0: tx, lock: null, hist: [[e.timeStamp, e.clientX]], id: e.pointerId }
})
track.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0
  if (!drag.lock) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return
    drag.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'
    if (drag.lock === 'x') { track.setPointerCapture(e.pointerId); release() }
  }
  if (drag.lock !== 'x') return
  let v = drag.t0 + dx; const min = -3 * W()
  if (v > 0) v *= 0.35; else if (v < min) v = min + (v - min) * 0.35 // rubber band at the ends
  setTrack(v)
  drag.hist.push([e.timeStamp, e.clientX]); if (drag.hist.length > 5) drag.hist.shift()
})
function endDrag(e) {
  if (!drag) return
  const d = drag; drag = null
  if (d.lock !== 'x') { if (tx !== -idx * W()) goTo(idx); return }
  suppressClick = true; setTimeout(() => (suppressClick = false), 0)
  const [ta, xa] = d.hist[0], [tb, xb] = d.hist[d.hist.length - 1]
  const vel = tb > ta ? ((xb - xa) / (tb - ta)) * 1000 : 0
  const dx = e.clientX - d.x0
  let i = idx
  if (dx < -W() * 0.2 || vel < -500) i++
  else if (dx > W() * 0.2 || vel > 500) i--
  goTo(Math.max(0, Math.min(3, i)), vel)
}

addEventListener('resize', () => setTrack(-idx * W()))
