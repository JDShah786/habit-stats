<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Palette options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;1,900&display=swap" rel="stylesheet" />
<style>
  /* Three green / white / black palettes, P3 Reload "water and bubbles" mood: rounded, glossy, flowing. */
  :root { --font: 'Montserrat', sans-serif; }
  body[data-p='a'] { --bg: #021a14; --bg2: #053a2c; --panel: rgb(255 255 255 / 0.07); --accent: #00e59b; --accent2: #7dffd0; --ink: #ffffff; --muted: #8fc9b5; --name: 'A · EMERALD TIDE'; }
  body[data-p='b'] { --bg: #050807; --bg2: #0d1f12; --panel: rgb(255 255 255 / 0.06); --accent: #39ff7a; --accent2: #c6ff3d; --ink: #ffffff; --muted: #9bb8a2; }
  body[data-p='c'] { --bg: #0a1d19; --bg2: #0f3a33; --panel: rgb(233 255 248 / 0.09); --accent: #2ee6c5; --accent2: #e9fff8; --ink: #ffffff; --muted: #a6d6cb; }

  * { box-sizing: border-box; }
  body {
    margin: 0; width: 390px; height: 844px; overflow: hidden; position: relative;
    font-family: var(--font); color: var(--ink);
    background: radial-gradient(120% 70% at 85% 0%, var(--bg2), var(--bg) 60%);
  }
  .bubble { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgb(255 255 255 / 0.55), color-mix(in srgb, var(--accent) 45%, transparent) 40%, transparent 72%);
    box-shadow: inset 0 0 12px rgb(255 255 255 / 0.25); opacity: 0.55; }
  .tag { position: absolute; top: 14px; right: 16px; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: var(--muted); }
  .wrap { position: relative; padding: 48px 20px 0; }
  h1 { margin: 0; font-weight: 900; font-style: italic; font-size: 54px; letter-spacing: -0.02em; line-height: 1; }
  .wave { display: block; margin: 6px 0 22px; }
  h2 { font-weight: 800; font-size: 13px; letter-spacing: 0.18em; color: var(--muted); margin: 22px 0 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 15px 18px; margin-bottom: 10px;
    border-radius: 999px; background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid rgb(255 255 255 / 0.10); }
  .dot { width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 32% 30%, #fff 0 12%, var(--accent2) 22%, var(--accent) 60%);
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent); }
  .dot.off { background: transparent; border: 2px solid rgb(255 255 255 / 0.25); box-shadow: none; }
  .name { flex: 1; font-weight: 600; font-size: 17px; }
  .min { font-weight: 900; font-style: italic; font-size: 20px; }
  .min small { font-size: 13px; font-weight: 600; font-style: normal; color: var(--muted); }
  .stat { margin-top: 24px; padding: 16px 18px; border-radius: 22px; background: var(--panel); border: 1px solid rgb(255 255 255 / 0.10); }
  .stat-top { display: flex; justify-content: space-between; align-items: baseline; }
  .stat b { font-weight: 900; font-style: italic; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; font-weight: 600; }
  .bar { margin-top: 10px; height: 12px; border-radius: 999px; background: rgb(255 255 255 / 0.08); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 58%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 12px var(--accent); }
  .btn { margin-top: 18px; display: inline-block; padding: 13px 30px; border-radius: 999px; font-weight: 900; font-style: italic; font-size: 18px;
    color: #021a14; background: linear-gradient(180deg, var(--accent2), var(--accent)); box-shadow: 0 6px 22px color-mix(in srgb, var(--accent) 55%, transparent); }
  .tabs { position: absolute; left: 14px; right: 14px; bottom: 22px; height: 62px; border-radius: 999px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
    background: rgb(0 0 0 / 0.55); border: 1px solid rgb(255 255 255 / 0.10); backdrop-filter: blur(10px); }
  .tabs div { text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--muted); }
  .tabs .on { color: var(--bg); background: var(--accent); margin: 0 6px; padding: 10px 0; border-radius: 999px; }
  .swatches { position: absolute; left: 20px; bottom: 100px; display: flex; gap: 8px; }
  .swatches i { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 0.2); }
</style>
</head>
<body>
  <div class="bubble" style="width:150px;height:150px;right:-40px;top:70px"></div>
  <div class="bubble" style="width:60px;height:60px;right:90px;top:30px"></div>
  <div class="bubble" style="width:26px;height:26px;right:70px;top:200px"></div>
  <div class="bubble" style="width:90px;height:90px;left:-30px;bottom:200px"></div>
  <div class="tag" id="tag"></div>

  <div class="wrap">
    <h1>TODAY</h1>
    <svg class="wave" width="150" height="14" viewBox="0 0 150 14"><path d="M2 8 Q 20 0 38 7 T 74 7 T 110 7 T 148 6" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/></svg>

    <h2>DAILY</h2>
    <div class="row"><i class="dot"></i><span class="name">Boxing</span><span class="min">45 <small>min</small></span></div>
    <div class="row"><i class="dot off"></i><span class="name">Running</span><span class="min">0 <small>min</small></span></div>
    <h2>ANYTIME</h2>
    <div class="row"><i class="dot"></i><span class="name">Guitar practice</span><span class="min">15 <small>min</small></span></div>

    <div class="stat">
      <div class="stat-top"><b>COURAGE</b><span>Rank 2 · Steady</span></div>
      <div class="bar"><i></i></div>
    </div>
    <span class="btn">LOG TIME</span>
  </div>

  <div class="swatches"><i style="background:var(--bg)"></i><i style="background:var(--bg2)"></i><i style="background:var(--accent)"></i><i style="background:var(--accent2)"></i><i style="background:#fff"></i></div>
  <nav class="tabs"><div class="on">TODAY</div><div>LIBRARY</div><div>STATS</div><div>MY HABITS</div></nav>

  <script>
    const p = new URLSearchParams(location.search).get('p') || 'a'
    document.body.dataset.p = p
    document.getElementById('tag').textContent = { a: 'A · EMERALD TIDE', b: 'B · NEON LIME', c: 'C · JADE GLASS' }[p]
  </script>
</body>
</html>
